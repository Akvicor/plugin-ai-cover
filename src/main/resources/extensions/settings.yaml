apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-ai-cover-settings
spec:
  forms:
    - group: default
      label: 封面生成设置
      formSchema:
        - $formkit: number
          name: maxConcurrentGenerations
          label: 全局并发上限
          value: 8
          min: 1
          max: 1024
          step: 1
          validation: 'required|number|between:1,1024|matches:/^\d+$/'
          help: 当前实例同时执行的封面任务数，范围为 1–1024，超出的任务排队等待。调低上限时已执行任务继续完成，释放名额后按新上限启动任务
        - $formkit: checkbox
          name: autoGenerateOnPublish
          label: 发布时自动生成缺失封面
          value: false
          help: 文章发布成功后在后台补齐缺失的封面，使用下方模型、提示词、存储策略和分组。进度可在文章列表或生成弹窗查看；失败不影响发布，模型调用可能产生费用
        - $formkit: textarea
          name: prompt
          label: 默认提示词
          value: "根据文章内容生成一个二次元美少女风格的图片，这个图片是png格式，尺寸是1600x900，我用来作为博客一篇文章的封面，图片中不要出现标题文字，只需要包含标题元素。"
          placeholder: 请输入生成封面图时使用的默认提示词
          validation: required
          help: 打开生成弹窗时会自动填充该提示词，用户可在弹窗中修改。插件会先用语言模型理解文章、生成画面描述，再按该提示词出图
        - $formkit: aiModelSelector
          name: descriptionModelName
          label: 文章理解模型（语言模型）
          modelType: language
          validation: required
          placeholder: 请选择用于理解文章的语言模型
          help: 第一步用该语言模型阅读文章并生成画面描述，只能选择 AI Foundation 中已配置且启用的语言模型
        - $formkit: aiModelSelector
          name: imageModelName
          label: 图片生成模型
          modelType: image-generation
          validation: required
          placeholder: 请选择用于出图的图片生成模型
          help: 第二步用该图片模型生成封面图，只能选择 AI Foundation 中已配置且启用的图片生成模型
        - $formkit: select
          name: aspectRatio
          label: 图片宽高比
          value: "16:9"
          help: 博客封面建议使用 16:9。部分模型可能不支持所选的宽高比，此时会使用模型默认值
          options:
            - label: 16:9（博客封面推荐）
              value: "16:9"
            - label: 3:2
              value: "3:2"
            - label: 4:3
              value: "4:3"
            - label: 1:1
              value: "1:1"
            - label: 9:16（竖版）
              value: "9:16"
        - $formkit: select
          name: pngCompressionMode
          label: PNG 压缩方式
          value: NONE
          validation: required
          help: 处理静态 PNG，保持尺寸。白底合成将透明区域与白色混合；去透明保留像素原始 RGB，原本隐藏的颜色会显示出来。两者均进行有损 256 色量化，预览和附件共用结果
          options:
            - label: 不处理
              value: NONE
            - label: 256 色压缩（白底合成）
              value: WHITE_BACKGROUND
            - label: 256 色压缩（去透明）
              value: REMOVE_ALPHA
        - $formkit: select
          name: jpegCompressionMode
          id: aiCoverJpegCompressionMode
          key: jpegCompressionMode
          label: JPEG 压缩方式
          value: NONE
          validation: required
          options:
            - label: 不处理
              value: NONE
            - label: 质量压缩
              value: QUALITY
          help: 保持 JPEG 格式和尺寸；重新编码后体积更小时采用压缩结果
        - $formkit: number
          if: "$get(aiCoverJpegCompressionMode).value === 'QUALITY'"
          name: jpegQuality
          key: jpegQuality
          label: JPEG 图片质量
          value: 80
          min: 1
          max: 100
          step: 1
          validation: 'required|number|between:1,100|matches:/^\d+$/'
          help: 数值越高通常画质越好、文件越大；范围 1–100，默认 80，属于有损压缩
        - $formkit: select
          name: webpCompressionMode
          id: aiCoverWebpCompressionMode
          key: webpCompressionMode
          label: WebP 压缩方式
          value: NONE
          validation: required
          options:
            - label: 不处理
              value: NONE
            - label: 质量压缩
              value: QUALITY
          help: 保持静态 WebP 的格式、尺寸和透明度；重新编码后体积更小时采用压缩结果
        - $formkit: number
          if: "$get(aiCoverWebpCompressionMode).value === 'QUALITY'"
          name: webpQuality
          key: webpQuality
          label: WebP 图片质量
          value: 80
          min: 1
          max: 100
          step: 1
          validation: 'required|number|between:1,100|matches:/^\d+$/'
          help: 数值越高通常画质越好、文件越大；范围 1–100，默认 80，颜色采用有损压缩，透明度保留原精度
        - $formkit: attachmentPolicySelect
          name: policyName
          label: 默认存储策略
          value: ""
          validation: required
          help: 封面图上传到附件库时默认使用的存储策略
        - $formkit: attachmentGroupSelect
          name: groupName
          label: 默认分组
          value: ""
          help: 封面图上传到附件库时默认使用的分组，留空表示不分组
