name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v3
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}
    permissions:
      contents: write
    with:
      java-version: 21
      node-version: 22
      pnpm-version: 10
      ui-path: "ui"
      # 待 Halo 应用市场创建应用后填写真实 app-id
      app-id: ""
      # 未在应用市场上架前跳过自动发布；填写 app-id 后移除该项
      skip-appstore-release: true
