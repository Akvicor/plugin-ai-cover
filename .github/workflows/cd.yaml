name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v5
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}
    permissions:
      contents: write
    with:
      java-version: 21
      node-version: 22
      pnpm-version: 10
      ui-path: "ui"
      app-id: "app-0rasmdah"
      # 发布 GitHub Release 时，应用市场发布由此开关控制。
      skip-appstore-release: false
